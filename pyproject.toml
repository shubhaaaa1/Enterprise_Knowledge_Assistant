[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG System — locally-hosted retrieval-augmented generation"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "neo4j>=5.0",
    "ollama>=0.2",
    "tree-sitter>=0.22",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
