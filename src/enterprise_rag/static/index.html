<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise RAG</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 14px; }

  /* HEADER */
  #header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 700; color: #a78bfa; flex: 1; }
  #health-badge { cursor: pointer; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #2d3148; background: #12151f; transition: all 0.2s; user-select: none; }
  #health-badge.ok { color: #4ade80; border-color: #4ade80; }
  #health-badge.degraded { color: #facc15; border-color: #facc15; }
  #health-badge.down { color: #f87171; border-color: #f87171; }
  #health-badge.checking { color: #64748b; border-color: #64748b; }
  #clear-btn { background: transparent; border: 1px solid #2d3148; color: #94a3b8; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  #clear-btn:hover { border-color: #f87171; color: #f87171; }

  /* TOKEN BAR */
  #token-bar { background: #12151f; border-bottom: 1px solid #2d3148; padding: 6px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #token-bar label { font-size: 12px; color: #64748b; white-space: nowrap; }
  #token-input { flex: 1; max-width: 340px; background: #1a1d27; border: 1px solid #2d3148; color: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-family: monospace; }
  #token-input:focus { outline: none; border-color: #4f46e5; }
  #session-display { font-size: 11px; color: #64748b; font-family: monospace; margin-left: auto; }

  /* BODY LAYOUT */
  #body { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  #sidebar { width: 280px; background: #12151f; border-right: 1px solid #2d3148; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  .sidebar-section { padding: 14px; border-bottom: 1px solid #2d3148; }
  .sidebar-section h3 { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

  /* UPLOAD */
  #drop-zone { border: 2px dashed #2d3148; border-radius: 8px; padding: 20px 12px; text-align: center; cursor: pointer; transition: all 0.2s; color: #64748b; font-size: 12px; line-height: 1.6; }
  #drop-zone:hover, #drop-zone.drag-over { border-color: #4f46e5; color: #a78bfa; background: rgba(79,70,229,0.05); }
  #drop-zone input[type=file] { display: none; }
  #drop-zone .drop-icon { font-size: 24px; display: block; margin-bottom: 6px; }
  #upload-status { margin-top: 8px; font-size: 12px; min-height: 18px; }
  #upload-status.uploading { color: #94a3b8; }
  #upload-status.success { color: #4ade80; }
  #upload-status.error { color: #f87171; }
  .perm-tags-row { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .perm-tags-row label { font-size: 11px; color: #64748b; white-space: nowrap; }
  .perm-tags-row input { flex: 1; background: #1a1d27; border: 1px solid #2d3148; color: #e2e8f0; padding: 4px 8px; border-radius: 5px; font-size: 11px; }
  .perm-tags-row input:focus { outline: none; border-color: #4f46e5; }

  /* CONNECT SOURCE */
  .source-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .source-tab { flex: 1; padding: 5px; border: 1px solid #2d3148; border-radius: 5px; background: transparent; color: #64748b; font-size: 12px; cursor: pointer; text-align: center; transition: all 0.2s; }
  .source-tab.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .source-form { display: none; flex-direction: column; gap: 7px; }
  .source-form.active { display: flex; }
  .source-form input { background: #1a1d27; border: 1px solid #2d3148; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .source-form input:focus { outline: none; border-color: #4f46e5; }
  .source-form input::placeholder { color: #475569; }
  .source-form button { background: #4f46e5; border: none; color: #fff; padding: 7px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: background 0.2s; }
  .source-form button:hover { background: #4338ca; }
  .source-form button:disabled { background: #2d3148; color: #64748b; cursor: not-allowed; }
  #connect-status { margin-top: 6px; font-size: 12px; min-height: 16px; }
  #connect-status.connecting { color: #94a3b8; }
  #connect-status.success { color: #4ade80; }
  #connect-status.error { color: #f87171; }
  #connect-status.info { color: #a78bfa; }

  /* MAIN CHAT */
  #chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }

  /* BUBBLES */
  .msg-row { display: flex; gap: 10px; max-width: 820px; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.assistant { align-self: flex-start; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
  .user .avatar { background: #1e40af; }
  .assistant .avatar { background: #312e81; }
  .bubble { padding: 12px 16px; border-radius: 12px; line-height: 1.6; max-width: 680px; }
  .user .bubble { background: #1e40af; color: #e2e8f0; border-bottom-right-radius: 3px; }
  .assistant .bubble { background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 3px; border: 1px solid #2d3148; }

  /* CITATIONS */
  .answer-text { white-space: pre-wrap; word-break: break-word; }
  .cite-ref { color: #a78bfa; font-size: 11px; font-weight: 700; cursor: default; background: rgba(167,139,250,0.15); padding: 1px 4px; border-radius: 3px; }
  .citations { margin-top: 12px; border-top: 1px solid #2d3148; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .citation-item { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; padding: 8px 10px; font-size: 12px; }
  .citation-item .cite-num { color: #a78bfa; font-weight: 700; margin-right: 4px; }
  .citation-item .cite-title { color: #e2e8f0; font-weight: 600; }
  .citation-item .cite-url { color: #4f46e5; text-decoration: none; font-size: 11px; display: block; margin-top: 2px; word-break: break-all; }
  .citation-item .cite-url:hover { text-decoration: underline; }
  .citation-item .cite-excerpt { color: #94a3b8; margin-top: 4px; font-style: italic; line-height: 1.4; }

  /* GROUNDING SCORE */
  .grounding-bar { margin-top: 10px; }
  .grounding-label { font-size: 11px; color: #64748b; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .grounding-track { height: 4px; background: #2d3148; border-radius: 2px; overflow: hidden; }
  .grounding-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }

  /* LOW CONFIDENCE WARNING */
  .low-conf-warning { margin-top: 8px; padding: 6px 10px; background: rgba(250,204,21,0.1); border: 1px solid rgba(250,204,21,0.3); border-radius: 6px; font-size: 12px; color: #facc15; }

  /* TYPING INDICATOR */
  #typing-indicator { display: none; align-self: flex-start; }
  #typing-indicator.visible { display: flex; }
  .typing-bubble { background: #1e293b; border: 1px solid #2d3148; border-radius: 12px; border-bottom-left-radius: 3px; padding: 12px 16px; display: flex; gap: 5px; align-items: center; }
  .dot { width: 7px; height: 7px; background: #64748b; border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* INPUT BAR */
  #input-bar { background: #1a1d27; border-top: 1px solid #2d3148; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #query-input { flex: 1; background: #0f1117; border: 1px solid #2d3148; color: #e2e8f0; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-family: inherit; resize: none; min-height: 44px; max-height: 140px; line-height: 1.5; transition: border-color 0.2s; }
  #query-input:focus { outline: none; border-color: #4f46e5; }
  #query-input::placeholder { color: #475569; }
  #send-btn { background: #4f46e5; border: none; color: #fff; width: 44px; height: 44px; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
  #send-btn:hover { background: #4338ca; }
  #send-btn:disabled { background: #2d3148; color: #64748b; cursor: not-allowed; }

  /* HEALTH MODAL */
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  #modal-overlay.visible { display: flex; }
  #health-modal { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 20px; min-width: 320px; max-width: 480px; width: 90%; }
  #health-modal h2 { font-size: 16px; font-weight: 700; color: #e2e8f0; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  #modal-close { background: transparent; border: none; color: #64748b; font-size: 20px; cursor: pointer; line-height: 1; }
  #modal-close:hover { color: #e2e8f0; }
  .component-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #2d3148; }
  .component-row:last-child { border-bottom: none; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.ok { background: #4ade80; }
  .status-dot.degraded { background: #facc15; }
  .status-dot.down, .status-dot.error { background: #f87171; }
  .status-dot.unknown { background: #64748b; }
  .component-name { flex: 1; font-size: 13px; color: #e2e8f0; }
  .component-status { font-size: 12px; color: #64748b; }

  /* WELCOME */
  .welcome-msg { text-align: center; color: #475569; padding: 40px 20px; }
  .welcome-msg .icon { font-size: 40px; margin-bottom: 12px; }
  .welcome-msg p { font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>⚡ Enterprise RAG</h1>
  <div id="health-badge" class="checking" onclick="toggleHealthModal()">● checking</div>
  <button id="clear-btn" onclick="clearSession()">✕ Clear Session</button>
</div>

<!-- TOKEN BAR -->
<div id="token-bar">
  <label for="token-input">Bearer Token</label>
  <input id="token-input" type="password" placeholder="Enter API token..." autocomplete="off">
  <span id="session-display">session: —</span>
</div>

<!-- BODY -->
<div id="body">

  <!-- SIDEBAR -->
  <div id="sidebar">

    <!-- UPLOAD FILES -->
    <div class="sidebar-section">
      <h3>Upload Files</h3>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <input type="file" id="file-input" accept=".txt,.md,.rst,.html,.py,.js,.ts,.java" multiple onchange="onFileSelect(event)">
        <span class="drop-icon">📄</span>
        Drop files here or click to browse<br>
        <span style="font-size:11px;color:#475569">.txt .md .rst .html .py .js .ts .java</span>
      </div>
      <div class="perm-tags-row">
        <label for="perm-tags">Tags</label>
        <input id="perm-tags" type="text" placeholder="e.g. internal,eng" title="Comma-separated permission tags">
      </div>
      <div id="upload-status"></div>
    </div>

    <!-- CONNECT SOURCE -->
    <div class="sidebar-section">
      <h3>Connect Source</h3>
      <div class="source-tabs">
        <button class="source-tab active" onclick="switchTab('github')">GitHub</button>
        <button class="source-tab" onclick="switchTab('jira')">Jira</button>
      </div>

      <!-- GitHub form -->
      <div id="github-form" class="source-form active">
        <input id="gh-repo" type="text" placeholder="owner/repo" autocomplete="off">
        <input id="gh-token" type="password" placeholder="GitHub token (optional)" autocomplete="off">
        <button onclick="connectGitHub()">Connect GitHub</button>
      </div>

      <!-- Jira form -->
      <div id="jira-form" class="source-form">
        <input id="jira-url" type="text" placeholder="https://yourorg.atlassian.net" autocomplete="off">
        <input id="jira-user" type="text" placeholder="username / email" autocomplete="off">
        <input id="jira-token" type="password" placeholder="API token" autocomplete="off">
        <input id="jira-project" type="text" placeholder="Project key (e.g. ENG)" autocomplete="off">
        <button onclick="connectJira()">Connect Jira</button>
      </div>

      <div id="connect-status"></div>
    </div>

  </div><!-- /sidebar -->

  <!-- CHAT PANEL -->
  <div id="chat-panel">
    <div id="messages">
      <div class="welcome-msg">
        <div class="icon">⚡</div>
        <p>Ask anything about your connected knowledge sources.<br>Upload files or connect GitHub / Jira to get started.</p>
      </div>
    </div>

    <!-- Typing indicator lives inside messages flow -->
    <div id="typing-indicator" style="padding: 0 24px 12px;">
      <div class="typing-bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <div id="input-bar">
      <textarea id="query-input" rows="1" placeholder="Ask a question… (Enter to send, Shift+Enter for newline)"
        onkeydown="onQueryKeydown(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendQuery()" title="Send">➤</button>
    </div>
  </div><!-- /chat-panel -->

</div><!-- /body -->

<!-- HEALTH MODAL -->
<div id="modal-overlay" onclick="closeHealthModal(event)">
  <div id="health-modal">
    <h2>System Health <button id="modal-close" onclick="closeHealthModal()">×</button></h2>
    <div id="modal-components">
      <div style="color:#64748b;font-size:13px">Loading…</div>
    </div>
  </div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let sessionId = generateId();
let lastHealthData = null;
let healthInterval = null;
let isStreaming = false;

document.getElementById('session-display').textContent = 'session: ' + sessionId.slice(0, 8) + '…';

// ─── UTILS ───────────────────────────────────────────────────────────────────
function generateId() {
  return 'sess_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
}

function getToken() {
  return document.getElementById('token-input').value.trim();
}

function authHeaders() {
  const t = getToken();
  return t ? { 'Authorization': 'Bearer ' + t } : {};
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function scrollToBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ─── HEALTH ──────────────────────────────────────────────────────────────────
async function checkHealth() {
  const badge = document.getElementById('health-badge');
  try {
    const resp = await fetch('/health', { headers: authHeaders() });
    const data = await resp.json();
    lastHealthData = data;
    const status = (data.status || 'unknown').toLowerCase();
    badge.className = status;
    badge.textContent = '● ' + status;
  } catch (e) {
    badge.className = 'down';
    badge.textContent = '● down';
    lastHealthData = null;
  }
}

function toggleHealthModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.toggle('visible');
  if (overlay.classList.contains('visible')) renderHealthModal();
}

function closeHealthModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay') || e.currentTarget === document.getElementById('modal-close')) {
    document.getElementById('modal-overlay').classList.remove('visible');
  }
}

function renderHealthModal() {
  const container = document.getElementById('modal-components');
  if (!lastHealthData) {
    container.innerHTML = '<div style="color:#64748b;font-size:13px">No health data. Click the badge to refresh.</div>';
    return;
  }
  const components = lastHealthData.components || {};
  if (Object.keys(components).length === 0) {
    container.innerHTML = '<div style="color:#64748b;font-size:13px">No component details available.</div>';
    return;
  }
  container.innerHTML = Object.entries(components).map(([name, info]) => {
    const st = typeof info === 'string' ? info : (info.status || 'unknown');
    const stClass = st.toLowerCase().replace(/[^a-z]/g, '') || 'unknown';
    return `<div class="component-row">
      <div class="status-dot ${stClass}"></div>
      <div class="component-name">${escHtml(name)}</div>
      <div class="component-status">${escHtml(st)}</div>
    </div>`;
  }).join('');
}

// ─── CHAT ─────────────────────────────────────────────────────────────────────
function onQueryKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuery();
  }
}

async function sendQuery() {
  if (isStreaming) return;
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  // Remove welcome message if present
  const welcome = document.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  appendUserBubble(query);
  showTyping(true);
  isStreaming = true;

  try {
    const resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ session_id: sessionId, query })
    });

    if (!resp.ok) {
      const err = await resp.text();
      showTyping(false);
      appendErrorBubble('Error ' + resp.status + ': ' + err);
      return;
    }

    const ct = resp.headers.get('content-type') || '';
    if (ct.includes('text/event-stream')) {
      await handleSSE(resp);
    } else {
      const data = await resp.json();
      showTyping(false);
      appendAssistantBubble(data);
    }
  } catch (e) {
    showTyping(false);
    appendErrorBubble('Network error: ' + e.message);
  } finally {
    isStreaming = false;
    document.getElementById('send-btn').disabled = false;
  }
}

async function handleSSE(resp) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let tokens = '';
  let finalData = null;

  // Create a streaming bubble
  const bubbleId = 'bubble-' + Date.now();
  showTyping(false);
  const row = createAssistantRow(bubbleId);
  document.getElementById('messages').appendChild(row);
  scrollToBottom();

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const evt = JSON.parse(raw);
          if (evt.token) {
            tokens += evt.token;
            document.getElementById(bubbleId).querySelector('.answer-text').textContent = tokens;
            scrollToBottom();
          }
          if (evt.done || evt.answer) {
            finalData = evt;
          }
        } catch (_) {
          // plain token text
          tokens += raw;
          document.getElementById(bubbleId).querySelector('.answer-text').textContent = tokens;
          scrollToBottom();
        }
      }
    }
  }

  // Render final answer with citations etc.
  if (finalData) {
    renderAnswer(document.getElementById(bubbleId), finalData);
  }
  scrollToBottom();
}

function createAssistantRow(bubbleId) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble" id="${bubbleId}">
      <div class="answer-text"></div>
    </div>`;
  return row;
}

function appendUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="avatar">👤</div><div class="bubble">${escHtml(text)}</div>`;
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}

function appendAssistantBubble(data) {
  const bubbleId = 'bubble-' + Date.now();
  const row = createAssistantRow(bubbleId);
  document.getElementById('messages').appendChild(row);
  renderAnswer(document.getElementById(bubbleId), data);
  scrollToBottom();
}

function appendErrorBubble(msg) {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `<div class="avatar">⚠️</div><div class="bubble" style="border-color:#f87171;color:#f87171">${escHtml(msg)}</div>`;
  document.getElementById('messages').appendChild(row);
  scrollToBottom();
}

function renderAnswer(bubble, data) {
  const answer = data.answer || data.text || '';
  const citations = data.citations || data.sources || [];
  const score = data.grounding_score != null ? data.grounding_score : data.score;
  const lowConf = data.low_confidence || false;

  // Render answer text with [N] citation refs
  const answerHtml = escHtml(answer).replace(/\[(\d+)\]/g, '<span class="cite-ref">[$1]</span>');

  let html = `<div class="answer-text">${answerHtml}</div>`;

  // Citations
  if (citations.length > 0) {
    html += '<div class="citations">';
    citations.forEach((c, i) => {
      const num = c.index != null ? c.index : i + 1;
      const title = c.title || c.source || c.doc_id || 'Source ' + num;
      const url = c.url || c.link || '';
      const excerpt = c.excerpt || c.text || c.content || '';
      html += `<div class="citation-item">
        <span class="cite-num">[${num}]</span><span class="cite-title">${escHtml(title)}</span>
        ${url ? `<a class="cite-url" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(url)}</a>` : ''}
        ${excerpt ? `<div class="cite-excerpt">"${escHtml(excerpt.slice(0, 200))}${excerpt.length > 200 ? '…' : ''}"</div>` : ''}
      </div>`;
    });
    html += '</div>';
  }

  // Grounding score
  if (score != null) {
    const pct = Math.round(score * 100);
    const color = pct >= 70 ? '#4ade80' : pct >= 40 ? '#facc15' : '#f87171';
    html += `<div class="grounding-bar">
      <div class="grounding-label"><span>Grounding score</span><span>${pct}%</span></div>
      <div class="grounding-track"><div class="grounding-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }

  // Low confidence warning
  if (lowConf) {
    html += `<div class="low-conf-warning">⚠ Low confidence — answer may be incomplete or uncertain.</div>`;
  }

  bubble.innerHTML = html;
}

function showTyping(visible) {
  const el = document.getElementById('typing-indicator');
  el.classList.toggle('visible', visible);
  if (visible) scrollToBottom();
}

// ─── CLEAR SESSION ────────────────────────────────────────────────────────────
async function clearSession() {
  try {
    await fetch('/session/' + sessionId, { method: 'DELETE', headers: authHeaders() });
  } catch (_) {}
  sessionId = generateId();
  document.getElementById('session-display').textContent = 'session: ' + sessionId.slice(0, 8) + '…';
  document.getElementById('messages').innerHTML = `
    <div class="welcome-msg">
      <div class="icon">⚡</div>
      <p>Session cleared. Ask anything about your connected knowledge sources.</p>
    </div>`;
}

// ─── FILE UPLOAD ──────────────────────────────────────────────────────────────
function onDragOver(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.add('drag-over');
}
function onDragLeave(e) {
  document.getElementById('drop-zone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  files.forEach(uploadFile);
}
function onFileSelect(e) {
  Array.from(e.target.files).forEach(uploadFile);
  e.target.value = '';
}

async function uploadFile(file) {
  const status = document.getElementById('upload-status');
  const tags = document.getElementById('perm-tags').value.trim() || 'public';
  status.className = 'uploading';
  status.textContent = `⏳ Uploading ${file.name}…`;

  const fd = new FormData();
  fd.append('file', file);
  fd.append('permission_tags', tags);

  try {
    const resp = await fetch('/upload', {
      method: 'POST',
      headers: authHeaders(),
      body: fd
    });
    if (resp.ok) {
      status.className = 'success';
      status.textContent = `✓ ${file.name} indexed!`;
    } else {
      const err = await resp.text();
      status.className = 'error';
      status.textContent = `✗ ${file.name}: ${err.slice(0, 80)}`;
    }
  } catch (e) {
    status.className = 'error';
    status.textContent = `✗ Network error: ${e.message}`;
  }
}

// ─── CONNECT SOURCE ───────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.source-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'github') || (i === 1 && tab === 'jira'));
  });
  document.getElementById('github-form').classList.toggle('active', tab === 'github');
  document.getElementById('jira-form').classList.toggle('active', tab === 'jira');
  document.getElementById('connect-status').textContent = '';
  document.getElementById('connect-status').className = '';
}

async function connectGitHub() {
  const repo = document.getElementById('gh-repo').value.trim();
  const token = document.getElementById('gh-token').value.trim();
  const status = document.getElementById('connect-status');

  if (!repo) { status.className = 'error'; status.textContent = '✗ Repository is required (owner/repo)'; return; }

  // GitHub connector is configured via environment variables on the server.
  // The token field here is informational — set GITHUB_TOKEN env var on the server.
  status.className = 'info';
  status.textContent = 'ℹ GitHub connector uses server-side env vars (GITHUB_TOKEN). Triggering ingest…';

  const btn = document.querySelector('#github-form button');
  btn.disabled = true;
  try {
    const resp = await fetch('/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ source_id: 'github', repo, full: true })
    });
    if (resp.ok) {
      status.className = 'success';
      status.textContent = `✓ GitHub ingest started for ${repo}`;
    } else {
      const err = await resp.text();
      status.className = 'error';
      status.textContent = `✗ ${err.slice(0, 120)}`;
    }
  } catch (e) {
    status.className = 'error';
    status.textContent = `✗ Network error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

async function connectJira() {
  const url = document.getElementById('jira-url').value.trim();
  const user = document.getElementById('jira-user').value.trim();
  const token = document.getElementById('jira-token').value.trim();
  const project = document.getElementById('jira-project').value.trim();
  const status = document.getElementById('connect-status');

  if (!url || !user || !token || !project) {
    status.className = 'error';
    status.textContent = '✗ All Jira fields are required';
    return;
  }

  status.className = 'connecting';
  status.textContent = '⏳ Connecting to Jira…';

  const btn = document.querySelector('#jira-form button');
  btn.disabled = true;
  try {
    const resp = await fetch('/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ source_id: 'jira', url, username: user, token, project_key: project, full: true })
    });
    if (resp.ok) {
      status.className = 'success';
      status.textContent = `✓ Jira ingest started for project ${project}`;
    } else {
      const err = await resp.text();
      status.className = 'error';
      status.textContent = `✗ ${err.slice(0, 120)}`;
    }
  } catch (e) {
    status.className = 'error';
    status.textContent = `✗ Network error: ${e.message}`;
  } finally {
    btn.disabled = false;
  }
}

// ─── ESCAPE HTML ──────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
checkHealth();
healthInterval = setInterval(checkHealth, 30000);
</script>
